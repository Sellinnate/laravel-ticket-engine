name: code-coverage

on:
  push:
    paths:
      - '**.php'
      - '.github/workflows/coverage.yml'
      - 'phpunit.xml.dist'
      - 'composer.json'
  pull_request:
    paths:
      - '**.php'
      - '.github/workflows/coverage.yml'
      - 'phpunit.xml.dist'
      - 'composer.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    name: Coverage (min 90%)

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl, fileinfo
          coverage: pcov

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction

      - name: Execute tests with coverage gate
        # shell: bash runs with -o pipefail, so the gate's exit code survives tee.
        shell: bash
        run: |
          mkdir -p build
          vendor/bin/pest --coverage --min=90 --ci --coverage-clover build/coverage.xml | tee build/coverage.txt

      - name: Coverage summary
        if: always()
        run: |
          {
            echo '## Code coverage'
            echo '```'
            grep -E 'Total:|%' build/coverage.txt | tail -n 40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-clover
          path: build/coverage.xml
          if-no-files-found: ignore
